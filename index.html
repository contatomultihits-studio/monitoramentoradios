<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA NO RÁDIO - Monitoramento Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top left, rgba(208,255,3,.18), transparent 32%), radial-gradient(circle at top right, rgba(234,127,159,.22), transparent 32%), linear-gradient(135deg, #f9f9ff 0%, #edf1ff 52%, #fff6f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .font-black { font-weight: 900 !important; }
        .btn-monitor {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-monitor:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .btn-monitor:active {
            transform: translateY(-4px);
        }

    </style>
</head>
<body>
    <div class="max-w-6xl mx-auto px-6 py-10 text-center">
        <!-- HEADER -->
        <div class="mb-12">
            <div class="bg-gradient-to-br from-[#0D0056] to-[#5279FF] p-6 rounded-3xl shadow-2xl inline-block mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/>
                    <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/>
                    <circle cx="12" cy="12" r="2"/>
                    <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/>
                    <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/>
                </svg>
            </div>
            <h1 class="font-black text-5xl tracking-tight text-[#0D0056] uppercase leading-none mb-4">IA NO RÁDIO</h1>
            <p class="text-xl font-bold text-[#5279FF] uppercase tracking-wider">Sistema de Monitoramento Inteligente</p>
        </div>

        <!-- CARD MUSICAL -->
        <div class="max-w-sm mx-auto">
            <a href="musical" class="btn-monitor block bg-white rounded-3xl shadow-xl p-8 border-4 border-transparent hover:border-[#EA7F9F]">
                <div class="bg-gradient-to-br from-[#EA7F9F] to-[#0D0056] p-5 rounded-2xl shadow-lg inline-block mb-5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"/>
                        <circle cx="6" cy="18" r="3"/>
                        <circle cx="18" cy="16" r="3"/>
                    </svg>
                </div>
                <h2 class="font-black text-2xl text-[#0D0056] uppercase mb-2">Monitoramento<br/>Musical</h2>
                <p class="text-slate-500 font-bold text-sm">Acompanhe músicas e execuções em tempo real</p>
            </a>
        </div>

        <!-- FOOTER -->
        <p class="text-center text-xs font-bold text-slate-300 uppercase tracking-widest mt-16">
            IA NO RÁDIO · Monitoramento em Tempo Real
        </p>
    </div>
</body>
</html>
